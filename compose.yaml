services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    env_file: ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    env_file: ${ENV_FILE:-.env}
    command:
      - /bin/sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: ${ENV_FILE:-.env}
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ -z "$${MINIO_ROOT_USER:-}" ] ||
           [ -z "$${MINIO_ROOT_PASSWORD:-}" ] ||
           [ -z "$${OBJECT_STORAGE_BUCKET:-}" ]; then
          echo "MinIO initialization configuration is incomplete." >&2
          exit 1
        fi

        attempt=1
        while ! mc alias set local http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          if [ "$$attempt" -ge 60 ]; then
            echo "MinIO did not become ready within the allowed time." >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done

        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}" >/dev/null
        mc ready local >/dev/null
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      API_PORT: ${API_PORT:-8000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    env_file: ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
