# Compose loads .env automatically. Use --env-file to select another environment file.
# Keep readable image tags; update their digests deliberately with each version bump.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ -z "$${MINIO_ROOT_USER:-}" ] ||
           [ -z "$${MINIO_ROOT_PASSWORD:-}" ] ||
           [ -z "$${OBJECT_STORAGE_ACCESS_KEY:-}" ] ||
           [ -z "$${OBJECT_STORAGE_SECRET_KEY:-}" ] ||
           [ -z "$${OBJECT_STORAGE_BUCKET:-}" ]; then
          echo "MinIO initialization configuration is incomplete." >&2
          exit 1
        fi

        if [ "$${MINIO_ROOT_USER}" = "$${OBJECT_STORAGE_ACCESS_KEY}" ]; then
          echo "MinIO admin and application access keys must be different." >&2
          exit 1
        fi

        if [ "$${MINIO_ROOT_PASSWORD}" = "$${OBJECT_STORAGE_SECRET_KEY}" ]; then
          echo "MinIO admin and application secret keys must be different." >&2
          exit 1
        fi

        attempt=1
        while ! mc alias set local http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          if [ "$$attempt" -ge 60 ]; then
            echo "MinIO did not become ready within the allowed time." >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done

        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}" >/dev/null
        policy_name="textbook-app-bucket-policy"
        policy_file="/tmp/textbook-app-bucket-policy.json"
        trap 'rm -f "$${policy_file}"' EXIT
        cat > "$${policy_file}" <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": ["arn:aws:s3:::$${OBJECT_STORAGE_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::$${OBJECT_STORAGE_BUCKET}/*"]
            }
          ]
        }
        EOF

        mc admin policy create local "$${policy_name}" "$${policy_file}" >/dev/null
        attach_policy=true
        if app_user_info="$$(mc admin user info --json local \
          "$${OBJECT_STORAGE_ACCESS_KEY}" 2>/dev/null)"; then
          case "$${app_user_info}" in
            *'"policyName":"textbook-app-bucket-policy"'*) attach_policy=false ;;
            *'"policyName":""'*) ;;
            *)
              echo "MinIO application user has unexpected policies; refusing to broaden access." >&2
              exit 1
              ;;
          esac
        fi
        mc admin user add local \
          "$${OBJECT_STORAGE_ACCESS_KEY}" "$${OBJECT_STORAGE_SECRET_KEY}" >/dev/null
        if [ "$${attach_policy}" = true ]; then
          mc admin policy attach local "$${policy_name}" \
            --user "$${OBJECT_STORAGE_ACCESS_KEY}" >/dev/null
        fi
    restart: "no"

  api:
    image: textbook-tutor-api:${API_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      PROVIDER_PROFILES_JSON: ${PROVIDER_PROFILES_JSON:-[]}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      CITATION_HMAC_SECRET: ${CITATION_HMAC_SECRET:?CITATION_HMAC_SECRET is required}
      FARO_API_BASE_URL: ${FARO_API_BASE_URL:-https://faroapi.com/v1}
      FARO_API_KEY: ${FARO_API_KEY:?FARO_API_KEY is required}
      FARO_MODEL: ${FARO_MODEL:-gemini-3.7-flash-tiered}
      FARO_CONTEXT_WINDOW: ${FARO_CONTEXT_WINDOW:-32000}
      FARO_TIMEOUT_SECONDS: ${FARO_TIMEOUT_SECONDS:-60}
      FARO_MAX_CONCURRENCY: ${FARO_MAX_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    image: textbook-tutor-api:${API_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      PROVIDER_PROFILES_JSON: ${PROVIDER_PROFILES_JSON:-[]}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      CITATION_HMAC_SECRET: ${CITATION_HMAC_SECRET:?CITATION_HMAC_SECRET is required}
      FARO_API_BASE_URL: ${FARO_API_BASE_URL:-https://faroapi.com/v1}
      FARO_API_KEY: ${FARO_API_KEY:?FARO_API_KEY is required}
      FARO_MODEL: ${FARO_MODEL:-gemini-3.7-flash-tiered}
      FARO_CONTEXT_WINDOW: ${FARO_CONTEXT_WINDOW:-32000}
      FARO_TIMEOUT_SECONDS: ${FARO_TIMEOUT_SECONDS:-60}
      FARO_MAX_CONCURRENCY: ${FARO_MAX_CONCURRENCY:-2}
    command: ["python", "-m", "tutor_api.worker_main"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:${API_PORT:-8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
