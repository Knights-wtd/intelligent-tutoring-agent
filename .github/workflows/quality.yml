name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements.lock
            apps/api/build-requirements.lock
            apps/api/dev-requirements.lock

      - name: Install API dependencies
        run: |
          python -m pip install --requirement build-requirements.lock
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement dev-requirements.lock
          python -m pip install --editable . --no-deps --no-build-isolation
          python -m pip check

      - name: Lint API
        run: python -m ruff check src tests

      - name: Validate Alembic migrations
        run: python -m alembic -c alembic.ini upgrade head --sql

      - name: Test API with coverage
        run: python -m pytest --cov=tutor_api --cov-report=term-missing --cov-fail-under=90

  agent-protocol:
    name: Agent protocol (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux / Node 24
          - os: windows-2025
            label: Windows / Node 24
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test agent protocol
        run: pnpm --dir packages/agent-protocol test

      - name: Typecheck agent protocol
        run: pnpm --dir packages/agent-protocol typecheck

  agent-runtime-linux:
    name: Agent runtime (Linux / Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test agent runtime
        run: pnpm --dir apps/agent-runtime test

      - name: Typecheck agent runtime
        run: pnpm --dir apps/agent-runtime typecheck

      - name: Lint agent runtime
        run: pnpm --dir apps/agent-runtime lint

      - name: Build agent runtime
        run: pnpm --dir apps/agent-runtime build

      - name: Package agent runtime
        run: pnpm --dir apps/agent-runtime package

  agent-runtime-windows:
    name: Agent runtime (Windows / Node 24)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test agent runtime
        run: pnpm --dir apps/agent-runtime test

      - name: Typecheck agent runtime
        run: pnpm --dir apps/agent-runtime typecheck

      - name: Lint agent runtime
        run: pnpm --dir apps/agent-runtime lint

      - name: Build agent runtime
        run: pnpm --dir apps/agent-runtime build

      - name: Package agent runtime
        run: pnpm --dir apps/agent-runtime package

      - name: Test Runtime PowerShell scripts
        run: node --test scripts/tests/agent-runtime-scripts.test.mjs

  claudian-conformance:
    name: Claudian conformance (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux / Node 24
          - os: windows-2025
            label: Windows / Node 24
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claudian conformance suite
        run: pnpm --dir apps/agent-runtime test:conformance

  vault-migration-smoke:
    name: Vault migration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: sqlite:///./vault-migration-smoke.db
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements.lock
            apps/api/build-requirements.lock
            apps/api/dev-requirements.lock

      - name: Install API dependencies
        run: |
          python -m pip install --requirement build-requirements.lock
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement dev-requirements.lock
          python -m pip install --editable . --no-deps --no-build-isolation
          python -m pip check

      - name: Exercise Alembic upgrade, rollback, and re-upgrade
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head

      - name: Test reversible Vault migration
        run: python -m pytest tests/test_vault_migration.py -q

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: pnpm test:web

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

      - name: Check emitted Agent artifacts
        run: pnpm check:web-artifacts

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag textbook-tutor-api:ci .

      - name: Import the worker entrypoint inside the API image
        run: |
          docker run --rm --entrypoint python textbook-tutor-api:ci \
            -c "import tutor_api.worker_main; import tutor_api.main"

      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag textbook-tutor-web:ci .
