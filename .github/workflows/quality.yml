name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements.lock
            apps/api/build-requirements.lock

      - name: Install API dependencies
        run: |
          python -m pip install --requirement build-requirements.lock
          python -m pip install --requirement requirements.lock
          python -m pip install --editable ".[dev]" --no-deps
          python -m pip install "httpx>=0.28,<1" "pytest>=8.4,<9" "pytest-cov>=6.2,<7" "ruff>=0.12,<1"

      - name: Lint API
        run: python -m ruff check src tests

      - name: Test API with coverage
        run: python -m pytest --cov=tutor_api --cov-report=term-missing --cov-fail-under=90

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: pnpm test:web

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web
